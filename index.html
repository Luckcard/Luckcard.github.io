<title>工程咨询知识库</title>

<style>
:root{--blue:#1d4ed8;--bg:#f1f5f9;--card:#fff;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--sub:#94a3b8;--line:#334155;--blue:#3b82f6;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
header{position:sticky;top:0;z-index:9;background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;}
header h1{font-size:17px;display:flex;justify-content:space-between;align-items:center;}
header h1 small{font-size:11px;font-weight:400;opacity:.85;}
#search{width:100%;margin-top:8px;padding:9px 12px;border:none;border-radius:10px;font-size:15px;background:rgba(255,255,255,.95);}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none;}
#cats::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;border:1px solid var(--line);cursor:pointer;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
#list{padding:8px 14px 90px;}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.item b{font-size:15px;display:block;margin-bottom:4px;}
.item .meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--bg);color:var(--sub);}
#reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;}
#reader.open{display:flex;}
#rbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--card);border-bottom:1px solid var(--line);}
#rbar button{border:none;background:var(--bg);color:var(--blue);font-size:15px;padding:6px 12px;border-radius:8px;cursor:pointer;}
#rbar span{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#rbody{flex:1;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);}
#rbody .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
#rbody h1{font-size:20px;margin-bottom:10px;} #rbody h2{font-size:17px;margin:16px 0 8px;}
#rbody h3{font-size:15px;margin:12px 0 6px;} #rbody p,#rbody li{font-size:15px;line-height:1.75;}
#rbody ul,#rbody ol{padding-left:1.4em;margin:6px 0;} #rbody table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0;display:block;overflow-x:auto;}
#rbody th,#rbody td{border:1px solid var(--line);padding:6px 8px;text-align:left;} #rbody th{background:var(--bg);}
#rbody blockquote{border-left:3px solid var(--blue);padding:4px 12px;color:var(--sub);margin:8px 0;}
#rbody code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px;}
a.wl{color:var(--blue);text-decoration:none;border-bottom:1px dashed var(--blue);}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
#fs{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:15;border:none;background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
</style>
</head>

const notes = DATA.notes;
let cat = "全部", q = "";
const cats = ["全部", ...new Set(notes.map(n => n.cat))];
const catsEl = document.getElementById('cats');
cats.forEach(c => { const d = document.createElement('div'); d.className = 'chip' + (c === '全部' ? ' on' : ''); d.textContent = c;
  d.onclick = () => { cat = c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.textContent === c)); renderList(); };
  catsEl.appendChild(d); });
document.getElementById('cnt').textContent = notes.length + ' 条';
document.getElementById('search').oninput = e => { q = e.target.value.trim().toLowerCase(); renderList(); };
let fsIdx = 0; const fsSizes = [15, 16.5, 18];
document.getElementById('fs').onclick = () => { fsIdx = (fsIdx + 1) % 3;
  document.querySelectorAll('#rbody p,#rbody li').forEach(el => el.style.fontSize = fsSizes[fsIdx] + 'px'); };
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function renderList(){
  const list = document.getElementById('list'); list.innerHTML = '';
  const res = notes.filter(n => (cat === '全部' || n.cat === cat) &&
    (!q || (n.title + n.html.replace(/<[^>]+>/g, '')).toLowerCase().includes(q)))
    .sort((a, b) => b.mtime - a.mtime);
  if (!res.length) { list.innerHTML = '<div class="empty">没有匹配的笔记</div>'; return; }
  res.forEach(n => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<b>${esc(n.title)}</b><div class="meta"><span class="tag">${n.cat}</span>${n.domain ? `<span class="tag">${esc(n.domain)}</span>` : ''}<span>${new Date(n.mtime * 1000).toLocaleDateString('zh-CN')}</span></div>`;
    d.onclick = () => openNote(n.id); list.appendChild(d);
  });
}
function openNote(id){
  const n = notes[id]; const r = document.getElementById('reader');
  document.getElementById('rtitle').textContent = n.title;
  document.getElementById('rbody').innerHTML = `<div class="card">${n.html}</div>`;
  document.getElementById('rbody').scrollTop = 0;
  r.classList.add('open');
  r.querySelectorAll('a.wl').forEach(a => a.onclick = e => {
    e.preventDefault(); const t = a.dataset.wl;
    const tid = DATA.titles[t] ?? DATA.files[t];
    if (tid !== undefined) openNote(tid);
  });
}
document.getElementById('back').onclick = () => document.getElementById('reader').classList.remove('open');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
renderList();
